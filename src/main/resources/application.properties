server.port=${SERVER_PORT:8181}

spring.application.name=nutrition-tracker-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nutrition}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nutrition_dev_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
