databaseChangeLog:
  - changeSet:
      id: 001-create-nutrition-entries
      author: demo
      changes:
        - sql:
            sql: |
              CREATE TABLE nutrition_entries (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  food_name VARCHAR(120) NOT NULL,
                  calories NUMERIC(9,2) NOT NULL CHECK (calories >= 0),
                  protein_g NUMERIC(7,2) NOT NULL CHECK (protein_g >= 0),
                  carbohydrates_g NUMERIC(7,2) NOT NULL CHECK (carbohydrates_g >= 0),
                  fat_g NUMERIC(7,2) NOT NULL CHECK (fat_g >= 0),
                  consumed_at TIMESTAMP NOT NULL
              );

  - changeSet:
      id: 002-load-demo-entries
      author: demo
      changes:
        - loadData:
            file: data/nutrition_entries.csv
            relativeToChangelogFile: true
            tableName: nutrition_entries
            encoding: UTF-8
            separator: ","
            columns:
              - column:
                  name: food_name
                  type: string
              - column:
                  name: calories
                  type: numeric
              - column:
                  name: protein_g
                  type: numeric
              - column:
                  name: carbohydrates_g
                  type: numeric
              - column:
                  name: fat_g
                  type: numeric
              - column:
                  name: consumed_at
                  type: timestamp
